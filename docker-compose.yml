services:
  portal:
    build:
      context: .
    image: customer-usage-alert-portal:local
    container_name: customer-usage-alert-portal
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      DB_URL: "jdbc:h2:file:/data/usage-alert;AUTO_SERVER=TRUE"
      ALERT_THRESHOLD_PERCENT: "${ALERT_THRESHOLD_PERCENT:-80}"
    volumes:
      - usage-alert-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  usage-alert-data:
