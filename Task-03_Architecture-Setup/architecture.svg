    <g fill="#657d82" font-size="11"><text x="175" y="178">Thymeleaf UI</text><text x="515" y="154">MVC · REST · service</text><text x="515" y="174">JPA · threshold rules</text><text x="885" y="178">Embedded persistence</text><text x="182" y="435">main / develop / feature</text><text x="482" y="435">Maven · Selenium · reports</text><text x="787" y="435">Build · tag · publish</text><text x="1045" y="435">Provision · deploy</text></g>
