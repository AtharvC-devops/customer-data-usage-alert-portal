<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="610" viewBox="0 0 1050 610" role="img" aria-labelledby="title desc">
  <title id="title">Usage portal use cases</title><desc id="desc">Operations and support actors use dashboard, search, entry, alerts, and customer details; DevOps configures deployments.</desc>
