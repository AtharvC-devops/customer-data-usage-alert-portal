name: Bug report
description: Report a reproducible problem in the Customer Data Usage Alert Portal.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible problem and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the dashboard\n2. Search for a customer\n3. Observe the result"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, application version
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshot
