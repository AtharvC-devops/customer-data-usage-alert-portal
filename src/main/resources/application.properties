spring.application.name=customer-usage-alert-portal
server.port=${SERVER_PORT:8085}
app.alert.threshold-percent=${ALERT_THRESHOLD_PERCENT:80}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/usage-alert;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
info.app.name=Customer Data Usage Alert Portal
info.app.version=1.0.0
