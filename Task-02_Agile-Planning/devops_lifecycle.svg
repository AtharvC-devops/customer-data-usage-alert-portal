<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="320" viewBox="0 0 1240 320" role="img" aria-labelledby="title desc">
  <title id="title">DevOps lifecycle for the Customer Data Usage Alert Portal</title>
  <desc id="desc">Plan, Code, Build, Test, Deploy, Operate, and Monitor feed back into Plan.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#007f78"/></marker></defs>
  <rect width="1240" height="320" rx="24" fill="#f4f8f7"/>
  <text x="58" y="58" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#007f78">DELIVERY LIFECYCLE</text>
  <g font-family="Arial" text-anchor="middle">
    <g fill="#fff" stroke="#dce7e6"><rect x="42" y="112" width="130" height="86" rx="14"/><rect x="210" y="112" width="130" height="86" rx="14"/><rect x="378" y="112" width="130" height="86" rx="14"/><rect x="546" y="112" width="130" height="86" rx="14"/><rect x="714" y="112" width="130" height="86" rx="14"/><rect x="882" y="112" width="130" height="86" rx="14"/><rect x="1050" y="112" width="146" height="86" rx="14"/></g>
    <g fill="#132d34" font-size="18" font-weight="700"><text x="107" y="161">Plan</text><text x="275" y="161">Code</text><text x="443" y="161">Build</text><text x="611" y="161">Test</text><text x="779" y="161">Deploy</text><text x="947" y="161">Operate</text><text x="1123" y="161">Monitor</text></g>
    <g fill="#657d82" font-size="11"><text x="107" y="180">Stories · backlog</text><text x="275" y="180">Git · review</text><text x="443" y="180">Maven · Docker</text><text x="611" y="180">JUnit · Selenium</text><text x="779" y="180">Jenkins · Ansible</text><text x="947" y="180">Container · health</text><text x="1123" y="180">Logs · feedback</text></g>
  </g>
  <g stroke="#007f78" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M174 155h28"/><path d="M342 155h28"/><path d="M510 155h28"/><path d="M678 155h28"/><path d="M846 155h28"/><path d="M1014 155h28"/><path d="M1123 212v50H107V212"/></g>
  <text x="615" y="286" text-anchor="middle" font-family="Arial" font-size="12" fill="#657d82">Feedback from the running service updates the next planning cycle</text>
